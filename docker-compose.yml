services:
  price-fetcher:
    build:
      context: ./price-fetcher
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - LONG_RUN=true

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
